services:
  db:
    image: mariadb:11
    container_name: catalogo-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: catalogodb
      MARIADB_USER: catalogouser
      MARIADB_PASSWORD: catalogopassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -prootpassword || exit 1"]
      interval: 4s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catalogo-backend
    restart: always
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: catalogouser
      DB_PASSWORD: catalogopassword
      DB_NAME: catalogodb
      JWT_SECRET: demo_secret_evaluation_parcial_202302220
      EXCEL_PATH: /app/data/CatalogoServicios.xlsx
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data:ro
      - ./docs:/app/docs:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: catalogo-frontend
    restart: always
    environment:
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mariadb_data:
    name: catalogo_servicios_mariadb_data
